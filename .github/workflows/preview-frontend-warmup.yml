name: Warm Savia Preview frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: savia-preview-frontend-warmup
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.SAVIA_PREVIEW_PLUGIN_EDITOR_ORIGIN != '' && github.event.repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      SAVIA_CI_FLOWS_ENABLED: ${{ vars.SAVIA_CI_FLOWS_ENABLED }}
      PREVIEW_PUSH_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check whether this push needs frontend assets
        id: plan
        run: node scripts/warm-preview-frontend.mjs --plan

      - name: Install dependencies
        if: ${{ steps.plan.outputs.needed == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Prepare frontend assets from the exact main revision
        if: ${{ steps.plan.outputs.needed == 'true' }}
        id: warmup
        run: node scripts/warm-preview-frontend.mjs "$RUNNER_TEMP/savia-frontend-assets"
        env:
          PREVIEW_PLUGIN_EDITOR_ORIGIN: ${{ vars.SAVIA_PREVIEW_PLUGIN_EDITOR_ORIGIN }}
          NODE_OPTIONS: "--max-old-space-size=1536"

      - name: Retain compiled frontend assets
        if: ${{ steps.warmup.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/savia-frontend-assets
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 2
