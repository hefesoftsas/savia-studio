        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace unit tests
        run: VITEST_SHARD_ARGS='--shard 1/2' pnpm run test:unit:workspace:studio

  workspace-4:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full') }}
    name: Workspace unit tests (Studio server 2/2)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace unit tests
        run: VITEST_SHARD_ARGS='--shard 2/2' pnpm run test:unit:workspace:studio

  contract-suite:
    name: Contract suite
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.reused_pr_ci != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked infrastructure dependencies
        run: npm ci --prefix infra/pulumi --ignore-scripts

      - name: Run contract tests
        run: pnpm run test:contracts

      - name: Verify Admin test distribution
        run: node --test scripts/admin-test-sequencer.test.mjs scripts/contract-check-gate.test.mjs

      - name: Verify security analysis selection
        run: node --test scripts/codeql-plan.test.mjs

      - name: Verify durable Preview publication evidence
        run: node --test scripts/preview-component-evidence.test.mjs scripts/preview-ci-reuse.test.mjs

      - name: Run offline Flows recovery contracts for infrastructure changes
        if: ${{ vars.SAVIA_CI_FLOWS_ENABLED != 'false' && needs.changes.outputs.ci_kind == 'infrastructure' }}
        run: node --test --test-concurrency=1 scripts/flows-*.test.mjs scripts/flows-maintenance/*.test.mjs scripts/encrypt-flows-backup.test.mjs scripts/verify-flows-preview.test.mjs

  contracts:
    name: Contract tests
    needs:
      - changes
      - plugin-validation
      - runtime-profile
      - contract-suite
      - api
      - api-2
      - api-3
      - api-extra-shards
      - assistant-mcp
      - admin
      - admin-2
      - admin-3
      - admin-4
      - admin-5
      - admin-6
    if: ${{ always() && needs.changes.outputs.reused_pr_ci != 'true' }}
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Require successful applicable CI lanes
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$CI_NEEDS" | node scripts/contract-check-gate.mjs

  typecheck:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full') }}
    name: Type-check (Core & Apps)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck:core

  flows-api:
    name: Flows API tests
    needs: changes
    if: ${{ !cancelled() && vars.SAVIA_CI_FLOWS_ENABLED != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.ci_flows == 'true') }}
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      NODE_OPTIONS: "--max-old-space-size=1536"
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Flows API shard 1 of 2
        run: pnpm --filter @savia/flows-api exec vitest run --shard 1/2
      - name: Test Flows API container helpers
        run: pnpm --filter @savia/flows-api exec node --test 'containers/ffmpeg/*.test.mjs'

  flows-api-2:
    name: Flows API tests (shard 2/2)
    needs: changes
    if: ${{ !cancelled() && vars.SAVIA_CI_FLOWS_ENABLED != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.ci_flows == 'true') }}
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      NODE_OPTIONS: "--max-old-space-size=1536"
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Flows API shard 2 of 2
        run: pnpm --filter @savia/flows-api exec vitest run --shard 2/2

  flows-core:
    name: Flows core tests
    needs: changes
    if: ${{ !cancelled() && vars.SAVIA_CI_FLOWS_ENABLED != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.ci_flows == 'true') }}
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      NODE_OPTIONS: "--max-old-space-size=1536"
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify imported source and local policy
        run: pnpm run flows:verify && pnpm --filter @savia/flows test && pnpm --filter @savia/flows-native test

  flows-packages:
    # These source-level suites do not consume the integration job's generated builds.
    name: Flows package tests
    needs: changes
    if: ${{ !cancelled() && vars.SAVIA_CI_FLOWS_ENABLED != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.ci_flows == 'true') }}
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      NODE_OPTIONS: "--max-old-space-size=1536"
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test independent Flows packages
        run: pnpm --filter @savia/flows-app test && pnpm --filter @savia/flows-runtime test && pnpm --filter @savia/flows-geo test && pnpm --filter @savia/flows-utils test

  flows-readiness:
    name: Flows types and recovery
    needs: changes
    if: ${{ !cancelled() && vars.SAVIA_CI_FLOWS_ENABLED != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.ci_flows == 'true') }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      NODE_OPTIONS: "--max-old-space-size=1536"
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check Flows and shared executor
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: pnpm run flows:typecheck && pnpm --filter @savia/hook-executor typecheck
      - name: Install locked infrastructure dependencies
        run: npm ci --prefix infra/pulumi --ignore-scripts
      - name: Verify infrastructure and recovery helpers offline
        run: node --test --test-concurrency=1 infra/pulumi/*.test.mjs scripts/flows-*.test.mjs scripts/flows-maintenance/*.test.mjs scripts/encrypt-flows-backup.test.mjs scripts/verify-flows-preview.test.mjs

  flows:
    name: Flows runtime and preview readiness
    needs:
      - changes
      - flows-api
      - flows-api-2
      - flows-core
      - flows-packages
      - flows-readiness
    if: ${{ !cancelled() && vars.SAVIA_CI_FLOWS_ENABLED != 'false' && (needs.changes.result != 'success' || needs.changes.outputs.ci_flows == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require all Flows validation lanes
        run: |
          if [[ "${{ needs.flows-api.result }}" != "success" || "${{ needs.flows-api-2.result }}" != "success" || "${{ needs.flows-core.result }}" != "success" || "${{ needs.flows-packages.result }}" != "success" || "${{ needs.flows-readiness.result }}" != "success" ]]; then
            echo "Flows validation failed: API shard 1=${{ needs.flows-api.result }}, API shard 2=${{ needs.flows-api-2.result }}, core=${{ needs.flows-core.result }}, packages=${{ needs.flows-packages.result }}, readiness=${{ needs.flows-readiness.result }}"
            exit 1
          fi

  publication-safety:
    name: Public source safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
      - name: Check tracked data and local configuration
        run: node --test scripts/public-release-hygiene.test.mjs
      - name: Scan reachable history for secrets
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --config .gitleaks.toml
