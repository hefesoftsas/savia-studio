name: Savia CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: savia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify affected work
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      flows: ${{ steps.plan.outputs.flows }}
      plugins: ${{ steps.plan.outputs.plugins }}
      plugin_only: ${{ steps.plan.outputs.plugin_only }}
      ci_kind: ${{ steps.plan.outputs.ci_kind }}
      ci_flows: ${{ steps.plan.outputs.ci_flows }}
      reused_pr_ci: ${{ steps.plan.outputs.reused_pr_ci }}
    steps:
      - name: Check out source history
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22

      - name: Classify changes with trusted base code
        # New profiles take effect only after their classifier reaches the base branch.
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          SAVIA_CI_FLOWS_ENABLED: ${{ vars.SAVIA_CI_FLOWS_ENABLED }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            test "$(git rev-parse HEAD)" = "$HEAD_SHA"
            echo "tested_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            BASE_SHA=""
          fi

          trusted_reuse="$RUNNER_TEMP/preview-ci-reuse.mjs"
          if [[ "$EVENT_NAME" == "push" && "${GITHUB_REF:-}" == "refs/heads/main" ]] \
            && git show "$BASE_SHA:scripts/preview-ci-reuse.mjs" > "$trusted_reuse" 2>/dev/null \
            && [[ "$(node "$trusted_reuse" "$BASE_SHA" "$HEAD_SHA")" == "true" ]]; then
            echo "Reusing successful CI for the exact merged tree and first parent."
            {
              echo 'kind=platform'
              echo 'plugin_only=false'
              echo 'plugins=[]'
              echo 'flows=false'
              echo 'ci_kind=none'
              echo 'ci_flows=false'
              echo 'reused_pr_ci=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          trusted_script="$RUNNER_TEMP/preview-change-plan.mjs"
          if [[ -n "$BASE_SHA" ]] && git show "$BASE_SHA:scripts/preview-change-plan.mjs" > "$trusted_script" 2>/dev/null; then
            node "$trusted_script" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
            ci_output="$RUNNER_TEMP/preview-change-plan-ci-output"
            rm -f "$ci_output"
            touch "$ci_output"
            if node "$trusted_script" --ci --base "$BASE_SHA" --head "$HEAD_SHA" --output "$ci_output" \
              && [[ "$(grep -c '^ci_kind=' "$ci_output")" == 1 ]] \
              && [[ "$(grep -c '^ci_flows=' "$ci_output")" == 1 ]] \
              && { { grep -Fxq 'ci_kind=full' "$ci_output" && grep -Fxq 'ci_flows=true' "$ci_output"; } || { grep -Exq 'ci_kind=(infrastructure|plugin|none|auth|api|backup-gate|assistant-api|ci-config|frontend|frontend-assistant-api)' "$ci_output" && grep -Fxq 'ci_flows=false' "$ci_output"; }; }; then
              cat "$ci_output" >> "$GITHUB_OUTPUT"
            else
              {
                echo 'ci_kind=full'
                echo 'ci_flows=true'
                echo 'reasons=["Trusted base classifier lacks CI classification; running full CI."]'
              } >> "$GITHUB_OUTPUT"
            fi
          else
            {
              echo 'kind=platform'
              echo 'flows=true'
              echo 'ci_kind=full'
              echo 'ci_flows=true'
              echo 'plugins=[]'
              echo 'plugin_only=false'
              echo 'reasons=["Trusted classifier or usable base revision unavailable; running full CI."]'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Preview CI proof ${{ github.event.pull_request.number }} ${{ github.event.pull_request.base.sha }} ${{ steps.plan.outputs.tested_tree }}${{ vars.SAVIA_CI_FLOWS_ENABLED == 'false' && ' (Flows skipped)' || '' }}
        if: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.plan.outputs.tested_tree != '' }}
        run: echo "The validation workflow checked out this merge tree."

  plugin-validation:
    name: Validate changed plugins
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.plugin_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      CHANGED_PLUGINS: ${{ needs.changes.outputs.plugins }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin package checks and pack changed plugins
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const plugins = JSON.parse(process.env.CHANGED_PLUGINS);
          for (const plugin of plugins) {
            const path = `${plugin.directory}/package.json`;
            let pkg;
            try { pkg = JSON.parse(readFileSync(path, 'utf8')); }
            catch { pkg = null; }
            if (pkg?.name) {
              for (const script of ['test', 'typecheck']) {
                if (!pkg.scripts?.[script]) continue;
                const run = spawnSync('pnpm', ['--filter', pkg.name, script], { stdio: 'inherit' });
                if (run.status !== 0) process.exit(run.status ?? 1);
              }
            }
            const pack = spawnSync('node', ['scripts/pack-store-plugin.mjs', plugin.directory], { stdio: 'inherit' });
            if (pack.status !== 0) process.exit(pack.status ?? 1);
          }
          NODE

  admin:
    # The six shards use historical costs; all discovered tests still run once.
    name: Admin unit tests (shard 1/6)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full' || needs.changes.outputs.ci_kind == 'frontend' || needs.changes.outputs.ci_kind == 'frontend-assistant-api') }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin unit tests
        run: VITEST_SHARD_ARGS='--shard 1/6 --config ../../scripts/admin-vitest.config.mts' pnpm run test:unit:admin

  admin-2:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full' || needs.changes.outputs.ci_kind == 'frontend' || needs.changes.outputs.ci_kind == 'frontend-assistant-api') }}
    name: Admin unit tests (shard 2/6)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin unit tests
        run: VITEST_SHARD_ARGS='--shard 2/6 --config ../../scripts/admin-vitest.config.mts' pnpm run test:unit:admin

  admin-3:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full' || needs.changes.outputs.ci_kind == 'frontend' || needs.changes.outputs.ci_kind == 'frontend-assistant-api') }}
    name: Admin unit tests (shard 3/6)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin unit tests
        run: VITEST_SHARD_ARGS='--shard 3/6 --config ../../scripts/admin-vitest.config.mts' pnpm run test:unit:admin

  admin-4:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full' || needs.changes.outputs.ci_kind == 'frontend' || needs.changes.outputs.ci_kind == 'frontend-assistant-api') }}
    name: Admin unit tests (shard 4/6)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin unit tests
        run: VITEST_SHARD_ARGS='--shard 4/6 --config ../../scripts/admin-vitest.config.mts' pnpm run test:unit:admin

  admin-5:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full' || needs.changes.outputs.ci_kind == 'frontend' || needs.changes.outputs.ci_kind == 'frontend-assistant-api') }}
    name: Admin unit tests (shard 5/6)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin unit tests
        run: VITEST_SHARD_ARGS='--shard 5/6 --config ../../scripts/admin-vitest.config.mts' pnpm run test:unit:admin

  admin-6:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full' || needs.changes.outputs.ci_kind == 'frontend' || needs.changes.outputs.ci_kind == 'frontend-assistant-api') }}
    name: Admin unit tests (shard 6/6)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin unit tests
        run: VITEST_SHARD_ARGS='--shard 6/6 --config ../../scripts/admin-vitest.config.mts' pnpm run test:unit:admin

  api:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(fromJSON('["full","api","assistant-api","frontend-assistant-api"]'), needs.changes.outputs.ci_kind)) }}
    name: API unit tests (shard 1/3)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      CI_KIND: ${{ needs.changes.outputs.ci_kind }}
      API_SHARD: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API unit tests
        run: |
          set -euo pipefail
          if [[ "$CI_KIND" == "api" || "$CI_KIND" == "assistant-api" || "$CI_KIND" == "frontend-assistant-api" ]]; then
            pnpm --filter @savia/api exec vitest run --shard "$API_SHARD/6"
            pnpm --filter @savia/api exec vitest run --config vitest.backup-gate.config.ts
          else
            VITEST_SHARD_ARGS='--shard 1/3' pnpm run test:unit:api
          fi

  api-2:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(fromJSON('["full","api","assistant-api","frontend-assistant-api"]'), needs.changes.outputs.ci_kind)) }}
    name: API unit tests (shard 2/3)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      CI_KIND: ${{ needs.changes.outputs.ci_kind }}
      API_SHARD: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API unit tests
        run: |
          set -euo pipefail
          if [[ "$CI_KIND" == "api" || "$CI_KIND" == "assistant-api" || "$CI_KIND" == "frontend-assistant-api" ]]; then
            pnpm --filter @savia/api exec vitest run --shard "$API_SHARD/6"
          else
            VITEST_SHARD_ARGS='--shard 2/3' pnpm run test:unit:api
          fi

  api-3:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(fromJSON('["full","api","assistant-api","frontend-assistant-api"]'), needs.changes.outputs.ci_kind)) }}
    name: API unit tests (shard 3/3)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      CI_KIND: ${{ needs.changes.outputs.ci_kind }}
      API_SHARD: "3"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API unit tests
        run: |
          set -euo pipefail
          if [[ "$CI_KIND" == "api" || "$CI_KIND" == "assistant-api" || "$CI_KIND" == "frontend-assistant-api" ]]; then
            pnpm --filter @savia/api exec vitest run --shard "$API_SHARD/6"
          else
            VITEST_SHARD_ARGS='--shard 3/3' pnpm run test:unit:api
          fi

  api-extra-shards:
    name: API unit tests focused shard ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["api","assistant-api","frontend-assistant-api"]'), needs.changes.outputs.ci_kind) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["4/6", "5/6", "6/6"]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      API_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run additional API unit test shard
        run: pnpm --filter @savia/api exec vitest run --shard "$API_SHARD"

  assistant-mcp:
    name: Assistant MCP and shared client checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.ci_kind == 'assistant-api' || needs.changes.outputs.ci_kind == 'frontend-assistant-api') }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test all MCP behavior
        run: pnpm --filter @savia/mcp test

      - name: Type-check MCP and shared assistant client
        run: pnpm --filter @savia/mcp exec tsc --noEmit && pnpm --filter @savia/release-catalog typecheck

  runtime-profile:
    name: Focused runtime tests and type checks
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
      contains(fromJSON('["auth","api","backup-gate","assistant-api","frontend","frontend-assistant-api"]'), needs.changes.outputs.ci_kind) }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      CI_KIND: ${{ needs.changes.outputs.ci_kind }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run profile-specific tests and type checks
        shell: bash
        run: |
          set -euo pipefail
          case "$CI_KIND" in
            frontend)
              pnpm --filter @savia/admin typecheck
              ;;
            auth)
              pnpm --filter @savia/auth test
              node --test scripts/auth-deployment/worker.test.mjs scripts/initialize-auth-deployment.test.mjs scripts/check-auth-bridge.test.mjs
              pnpm --filter @savia/auth exec tsc --noEmit
              ;;
            api)
              pnpm --filter @savia/api exec tsc --noEmit
              pnpm --filter @savia/admin typecheck
              ;;
            backup-gate)
              node --test packages/backup-gate/*.test.mjs
              pnpm --filter @savia/api exec vitest run --config vitest.backup-gate.config.ts
              pnpm --filter @savia/auth test
              pnpm --filter @savia/request test
              pnpm --filter @savia/connector-gateway test
              pnpm --filter @savia/api exec tsc --noEmit
              pnpm --filter @savia/auth exec tsc --noEmit
              pnpm --filter @savia/request typecheck
              pnpm --filter @savia/connector-gateway typecheck
              ;;
            assistant-api|frontend-assistant-api)
              pnpm --filter @savia/api exec tsc --noEmit
              pnpm --filter @savia/admin typecheck
              pnpm --filter @savia/admin exec vitest run src/features/assistant/assistant-api.test.ts
              ;;
            *)
              echo "Unsupported focused CI profile: $CI_KIND" >&2
              exit 1
              ;;
          esac

  workspace:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full') }}
    name: Workspace unit tests (Core packages)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace unit tests
        run: pnpm run test:unit:workspace:core

  workspace-3:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci_kind == 'full') }}
    name: Workspace unit tests (Studio server 1/2)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5.1.0

